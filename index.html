.kind.rm.sel{border-color:#ff3b3b;background:#ffe1e1;color:#d11;}

.sw.sel{box-shadow:0 0 0 4px #ff4f8b;}
.grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;}
#buildBar .big{margin:0;padding:10px 20px;font-size:1.15em;}
#clearBtn{background:none;color:#c98aa5;font-size:.85em;text-decoration:underline;min-height:44px;padding:8px 12px;}

.shareCard .tip{font-size:clamp(14px,2.2vmin,18px);color:#a0557a;margin:.5em 0 .2em;}

.shareCard .big{margin:0;text-decoration:none;font-size:clamp(17px,2.8vmin,24px);padding:12px 22px;}
#winShareBtn{background:linear-gradient(#ffe066,#ffb02e);box-shadow:0 6px 0 #d98a00;color:#6a3d00;animation:pop .4s ease-out;}

          <p data-i18n="how1"></p>
          <p data-i18n="how2"></p>

          <button class="big" id="startBtn" data-i18n="start">Play</button>
          <button class="big free" id="freeBtn" data-i18n="free">🏡 Free Build</button>
          <button class="big alt" id="townBtn" data-i18n="town">My Town</button>
          <p class="freeNote" data-i18n="freeNote"></p>
          <div class="cardFoot">
            <button class="pill" id="langBtn2">🌐 中文</button>
            <a class="pill" id="starLink" href="https://github.com/designowpro-debug/heart-crossing-game" target="_blank" rel="noopener" data-i18n="star">⭐ Star on GitHub</a>
          </div>
        </div>
      </div>
      <div id="hint" class="hidden" data-i18n="hint"></div>
      <div class="overlay hidden" id="crashScreen">
        <div class="card">
          <h2 data-i18n="crashT">💥 Bonk!</h2>
          <p data-i18n="crashP"></p>
          <button class="big" id="retryBtn" data-i18n="retry">Try Again</button>
        </div>
      </div>
      <div class="overlay hidden" id="shareModal">
        <div class="card shareCard">
          <h2 data-i18n="shareHead">📸 Share my town</h2>
          <img id="shareImg" alt="My Heart Town">
          <p class="tip" data-i18n="shareSaveHint"></p>
          <div class="row">
            <a class="big" id="saveImgBtn" href="#" download="my-heart-town.png" data-i18n="saveImg">💾 Save image</a>
            <button class="big alt" id="copyLinkBtn">🔗 Copy link</button>
          </div>
          <div class="row">
            <button class="pill" id="shareAgainBtn" data-i18n="shareAgain">📤 Share</button>
            <button class="pill" id="closeShareBtn" data-i18n="close">✖ Close</button>
          </div>
        </div>
      </div>
      <div id="roomBar" class="hidden">
        <div id="roomMsg" data-i18n="roomMsg0"></div>
        <div id="furnGrp"></div>
        <div id="roomTools">
          <button class="opt" id="flipBtn" data-i18n="flip">🔄 Flip</button>
          <button class="opt" id="trashBtn">🗑️ Remove</button>
          <button class="opt" id="emptyBtn" data-i18n="emptyRoom">🧹 Clear Room</button>
          <button class="big" id="backBtn" data-i18n="back">🏘️ Back to Town</button>
        </div>
      </div>
      <div id="buildBar" class="hidden">
        <div id="buildMsg"></div>
        <div class="grp" id="kindGrp"></div>
        <div class="grp" id="styleGrp"></div>
        <div class="grp" id="colorGrp"></div>
        <button class="big hidden" id="winShareBtn">🎉 Share</button>
        <button class="big" id="goBtn">🚗 Cross!</button>
        <button class="big alt" id="shareBtn" data-i18n="shareTown">📸 Share my town</button>
        <button class="pill" id="menuBtn" data-i18n="menu">🏠 Menu</button>
        <button id="clearBtn" data-i18n="clearTown">Clear town</button>
      </div>
    </div>
    <div id="pad">
      <button class="up" data-d="up" data-i18n-aria="up" aria-label="Up">▲</button>
      <button class="left" data-d="left" data-i18n-aria="left" aria-label="Left">◀</button>
      <div class="mid">💗</div>
      <button class="right" data-d="right" data-i18n-aria="right" aria-label="Right">▶</button>
      <button class="down" data-d="down" data-i18n-aria="down" aria-label="Down">▼</button>
    </div>
  </div>
</div>

  return a?v.replace(/\{(\w+)\}/g,function(_,x){return a[x]!==undefined?a[x]:'';}):v;}

// ---------- save ----------
var FREE_KEY='heartTownFree_v1',FREE=false;
function loadSave(key){
  var o={houses:[],tickets:0,level:1,score:0,muted:false,style:0,color:0,kind:'house',gstyle:0,pstyle:0,ystyle:0,v:4};
  try{var s=JSON.parse(localStorage.getItem(key)||'null'); if(s&&typeof s==='object'){for(var k in o){if(k in s)o[k]=s[k];}}}catch(e){}
  // migrate older saves: every house gets an id and its own interior (items)
  if(!Array.isArray(o.houses))o.houses=[];
  o.houses=o.houses.filter(function(h){return h&&typeof h==='object'&&isFinite(h.c)&&isFinite(h.r);});
  o.houses.forEach(function(h,i){if(!h.id)h.id='h'+Date.now().toString(36)+i;if(['garden','pond','play'].indexOf(h.kind)<0)h.kind='house';
    if(!Array.isArray(h.items))h.items=[];
    h.items=h.items.filter(function(it){return it&&typeof it.t==='string'&&isFinite(it.x)&&isFinite(it.y);});});
  if(['house','garden','pond','play'].indexOf(o.kind)<0)o.kind='house';o.v=4;return o;
}
var saveC=loadSave(SAVE_KEY),saveF=loadSave(FREE_KEY),save=saveC;
function persist(){try{localStorage.setItem(FREE?FREE_KEY:SAVE_KEY,JSON.stringify(save,function(k,v){return (k==='pop'||k==='fxT')?undefined:v;}));}catch(e){}}

// ---------- audio ----------
var actx=null;
function unlockAudio(){
  try{
    if(!actx){var AC=window.AudioContext||window.webkitAudioContext; if(!AC)return; actx=new AC();}
    if(actx.state==='suspended')actx.resume();
    // iOS: play a silent buffer inside the user gesture
    var b=actx.createBuffer(1,1,22050),src=actx.createBufferSource();src.buffer=b;src.connect(actx.destination);src.start(0);
  }catch(e){}
}
function tone(f,dur,type,vol,f2,delay){
  if(save.muted||!actx)return;
  var t=actx.currentTime+(delay||0),o=actx.createOscillator(),g=actx.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol||0.15,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+dur+0.02);
}
function noise(dur,vol){
  if(save.muted||!actx)return;
  var n=Math.floor(actx.sampleRate*dur),b=actx.createBuffer(1,n,actx.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=actx.createBufferSource(),g=actx.createGain();s.buffer=b;g.gain.value=vol||0.3;s.connect(g);g.connect(actx.destination);s.start();
}
var sfx={
  hop:function(){tone(520,0.09,'square',0.06,780);},
  coin:function(){tone(990,0.08,'square',0.07);tone(1320,0.15,'square',0.07,null,0.07);},
  crash:function(){noise(0.4,0.35);tone(300,0.5,'sawtooth',0.12,60);},
  win:function(){[523,659,784,1047].forEach(function(f,i){tone(f,0.2,'triangle',0.15,null,i*0.11);});},
  place:function(){tone(400,0.12,'sine',0.2,900);tone(1200,0.1,'triangle',0.08,null,0.08);},
  no:function(){tone(220,0.15,'square',0.07,180);},
  click:function(){tone(700,0.05,'sine',0.1);}
};

// ---------- helpers ----------
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function shade(hex,a){var n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;
  function f(c){return Math.max(0,Math.min(255,Math.round(a<0?c*(1+a):c+(255-c)*a)));}
  return 'rgb('+f(r)+','+f(g)+','+f(b)+')';}
function rnd(a,b){return a+Math.random()*(b-a);}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function heartPath(x,y,s,g){g=g||ctx;g.beginPath();g.moveTo(x,y+0.42*s);
  g.bezierCurveTo(x-0.1*s,y+0.3*s,x-0.5*s,y+0.1*s,x-0.5*s,y-0.12*s);
  g.bezierCurveTo(x-0.5*s,y-0.42*s,x-0.08*s,y-0.45*s,x,y-0.2*s);
  g.bezierCurveTo(x+0.08*s,y-0.45*s,x+0.5*s,y-0.42*s,x+0.5*s,y-0.12*s);
  g.bezierCurveTo(x+0.5*s,y+0.1*s,x+0.1*s,y+0.3*s,x,y+0.42*s);g.closePath();}

var CAR_COLORS=['#ff5e5e','#ffb02e','#ffe14d','#4fc3f7','#7c6cf2','#43d18a','#ff7ad1','#ff8a3d','#36c9c6'];

var STYLES=[{n:['Cottage','小屋'],e:'🏠'},{n:['Tower','高樓'],e:'🏢'},{n:['Castle','城堡'],e:'🏰'},{n:['Heart House','愛心屋'],e:'💗'}].map(i18nName);

// ---------- game state ----------
var mode='title'; // title | play | crash | win | build
var lights=[],rows=[],player,particles=[],floaters=[],shake=0,timer=0,queued=null,maxRow=0,time=0;
var view={w:0,h:0,cell:40,ox:0,oy:0};

function buildLevel(){
  var L=save.level, lanes=Math.min(4+L,11);
  rows=[{type:'grass',start:true,seed:Math.random()}];
  var since=0,lastDir=pick([-1,1]);
  for(var i=0;i<lanes;i++){
    if(since>=3&&Math.random()<0.5&&i<lanes-1){rows.push({type:'grass',seed:Math.random()});since=0;}
    var dir=Math.random()<0.7?-lastDir:lastDir;lastDir=dir;
    var speed=Math.min(1.0+L*0.22+rnd(0,1.1),6.5);
    var count=1+Math.floor(Math.random()*(1.6+Math.min(L,6)*0.35));
    var span=COLS+6,gap=span/count,cars=[];
    for(var j=0;j<count;j++){var truck=Math.random()<0.22;
      cars.push({x:-3+j*gap+rnd(0,gap*0.35),len:truck?2:1.25,truck:truck,color:pick(CAR_COLORS)});}
    rows.push({type:'road',dir:dir,speed:speed,cars:cars,span:span});since++;
  }
  rows.push({type:'goal'});
  // heart traffic lights: one per road segment, crosswalk column cw
  lights=[];var seg=null;
  for(var ri=0;ri<rows.length;ri++){
    if(rows[ri].type==='road'){
      if(!seg){var G=3.4+Math.min(L,8)*0.15,Y=1.0,Rd=Math.max(2.2,3.4-L*0.12);
        seg={cw:2+Math.floor(Math.random()*5),first:ri,last:ri,G:G,Y:Y,R:Rd,t:Math.random()*(G+Y+Rd),state:'green'};lights.push(seg);}
      seg.last=ri;rows[ri].light=seg;rows[ri].cw=seg.cw;
    }else seg=null;
  }
  lights.forEach(updLightState);
  // coins
  var roadIdx=[];rows.forEach(function(r,i){if(r.type==='road')roadIdx.push(i);});
  var nc=Math.min(2+Math.floor(L/2),5);
  for(var k=0;k<nc&&roadIdx.length;k++){var ri=pick(roadIdx);rows[ri].coin=rows[ri].coin||Math.floor(Math.random()*COLS);}
  player={c:4,r:0,fc:4,fr:0,t:1,dir:1,dead:false};
  maxRow=0;queued=null;particles=[];floaters=[];
  resize();
}

var hintTimer=null;function showHint(){var h=$('hint');h.classList.remove('hidden');h.style.opacity='1';clearTimeout(hintTimer);hintTimer=setTimeout(function(){h.style.opacity='0';setTimeout(function(){h.classList.add('hidden');},500);},4500);}
function startPlay(){unlockAudio();if(FREE)setFreeMode(false);$('winShareBtn').classList.add('hidden');setTimeout(showHint,0);hideAll();document.body.classList.remove('building','inroom');buildLevel();mode='play';updateHud();}
function hideAll(){['titleScreen','crashScreen','buildBar','roomBar','hint','shareModal'].forEach(function(id){$(id).classList.add('hidden');});}

function move(dir){
  if(mode!=='play'||player.dead)return;
  if(player.t<1){queued=dir;return;}
  var dc=0,dr=0;
  if(dir==='up')dr=1;else if(dir==='down')dr=-1;else if(dir==='left')dc=-1;else if(dir==='right')dc=1;
  var nc=Math.max(0,Math.min(COLS-1,player.c+dc)),nr=Math.max(0,Math.min(rows.length-1,player.r+dr));
  if(dc)player.dir=dc;
  if(nc===player.c&&nr===player.r)return;
  player.fc=player.c;player.fr=player.r;player.c=nc;player.r=nr;player.t=0;sfx.hop();
}

function curPos(){var e=player.t<1?Math.sin(player.t*Math.PI/2):1;
  return {c:player.fc+(player.c-player.fc)*e,r:player.fr+(player.fr===player.r?0:(player.r-player.fr)*e)};}

function crash(){
  player.dead=true;mode='crash';shake=0.45;timer=0;sfx.crash();
  var p=curPos();
  for(var i=0;i<26;i++){var a=Math.random()*Math.PI*2,sp=rnd(2,7);
    particles.push({x:p.c+0.5,y:p.r+0.5,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,max:rnd(0.6,1.1),
      color:pick(['#ff4f8b','#ff9cc2','#ffe14d','#fff']),type:Math.random()<0.5?'heart':'star',s:rnd(0.15,0.3)});}
}
function win(){
  mode='win';timer=0;sfx.win();
  winLevel=save.level;var reward=100*save.level;save.score+=reward;save.tickets+=1;save.level+=1;persist();
  floaters.push({x:player.c+0.5,y:player.r+1,t:0,txt:'+'+reward});
  for(var i=0;i<50;i++){particles.push({x:rnd(0,COLS),y:rows.length+rnd(0,1),vx:rnd(-1.5,1.5),vy:rnd(-1,-5),life:1,max:rnd(1,1.8),
    color:pick(HOUSE_COLORS.concat(['#ffe14d'])),type:pick(['heart','star','dot']),s:rnd(0.12,0.25),g:3});}
  updateHud();
}

function updateHud(){
  $('hLevel').textContent=T('level',{n:save.level});

  $('hHouses').textContent=FREE?('🏘️ '+save.houses.length):('🏘️ '+save.houses.length+' 🎟️ '+save.tickets);
  $('muteBtn').textContent=save.muted?'🔇':'🔊';
}

// ---------- update ----------
function update(dt){
  time+=dt;
  lights.forEach(function(l){var prev=l.state;l.t+=dt;updLightState(l);
    if(prev!==l.state&&l.state==='red'&&mode==='play'&&player&&Math.abs(player.r-l.first)<=2)tone(1047,0.12,'sine',0.05);});
  rows.forEach(function(r){if(r.type==='road')updateLane(r,dt);});
  if(player&&mode==='play'){
    if(player.t<1){player.t=Math.min(1,player.t+dt/0.14);
      if(player.t>=1){
        var row=rows[player.r];
        if(player.r>maxRow){save.score+=10*(player.r-maxRow);maxRow=player.r;updateHud();}
        if(row.coin!==undefined&&row.coin!==false&&row.coin===player.c){row.coin=false;save.score+=50;sfx.coin();
          floaters.push({x:player.c+0.5,y:player.r+1,t:0,txt:'+50'});updateHud();}
        if(row.type==='goal'){win();}
        else if(queued){var q=queued;queued=null;move(q);}
      }}
    // collision
    if(mode==='play'){
      var p=curPos(),ri=Math.round(p.r),row2=rows[ri];
      if(row2&&row2.type==='road'){var hx=p.c+0.5;
        for(var i=0;i<row2.cars.length;i++){var c=row2.cars[i];
          if(hx+0.3>c.x+0.08&&hx-0.3<c.x+c.len-0.08){crash();break;}}}
    }
  }
  if(mode==='crash'){timer+=dt;if(timer>0.9&&$('crashScreen').classList.contains('hidden')){$('crashScreen').classList.remove('hidden');persist();}}
  if(mode==='win'){timer+=dt;if(timer>1.3){enterBuild(T('win'));var wb=$('winShareBtn');wb.textContent=T('winShare',{n:winLevel});wb.classList.remove('hidden');}}
  if(shake>0)shake-=dt;
  particles=particles.filter(function(p){p.life-=dt/p.max;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy-=(p.g!==undefined?p.g:9)*dt;return p.life>0;});
  floaters=floaters.filter(function(f){f.t+=dt;return f.t<1;});
  townAnim.forEach(function(h){if(h.pop<1)h.pop=Math.min(1,h.pop+dt*3);});
}

function updLightState(l){var cyc=l.G+l.Y+l.R,ph=((l.t%cyc)+cyc)%cyc;l.state=ph<l.G?'green':(ph<l.G+l.Y?'yellow':'red');l.left=ph<l.G?l.G-ph:(ph<l.G+l.Y?l.G+l.Y-ph:cyc-ph);}
var BRAKE=7,ACCEL=3.5;
function laneStop(r){return r.dir>0?r.cw-0.12:-(r.cw+1+0.12);}
function updateLane(r,dt){
  var Lt=r.light,span=r.span,S=Lt?laneStop(r):0;
  var fr=r.cars.map(function(c){return r.dir>0?c.x+c.len:-c.x;});
  r.cars.forEach(function(c,i){
    var f=fr[i];if(c.v===undefined)c.v=r.speed;
    var gap=Infinity;
    for(var j=0;j<r.cars.length;j++){if(j===i)continue;var g=(((fr[j]-r.cars[j].len)-f)%span+span)%span;if(g<gap)gap=g;}
    var lim=gap-0.3;
    if(Lt){var d=S-f;
      if(d<-0.05){c.run=false;}
      else if(Lt.state!=='green'&&!c.run){
        if(Lt.state==='yellow'&&d<c.v*c.v/(2*BRAKE)*0.9&&d<1.5)c.run=true; // too close to stop safely: keep going
        else lim=Math.min(lim,d);
      }
      if(Lt.state==='green')c.run=false;
    }
    var target=Math.min(r.speed,Math.sqrt(2*BRAKE*Math.max(0,lim)));
    if(target<c.v)c.v=target;else c.v=Math.min(target,c.v+ACCEL*dt);
    var step=Math.min(c.v*dt,Math.max(0,lim));
    c.x+=r.dir*step;
    if(r.dir>0&&c.x>COLS+3)c.x-=span;if(r.dir<0&&c.x+c.len<-3)c.x+=span;
  });
}
function drawLight(l){
  var C=view.cell,x0=view.ox,gy=rowY(l.first-1),cw=l.cw;

  // pole
  ctx.fillStyle='#8c8c99';ctx.fillRect(hx+hw*0.5-C*0.04,hy+hh,C*0.08,C*0.42);
  ctx.fillStyle='#6f6f7a';ctx.beginPath();ctx.ellipse(hx+hw*0.5,gy+C*0.9,C*0.14,C*0.05,0,0,7);ctx.fill();
  // housing
  ctx.fillStyle='#3b3550';rr(hx,hy,hw,hh,hh*0.45);ctx.fill();ctx.strokeStyle='#ff9cc2';ctx.lineWidth=Math.max(1.5,C*0.03);ctx.stroke();
  var cols={red:'#ff2f6d',yellow:'#ffd23f',green:'#3ddc84'};
  ['red','yellow','green'].forEach(function(k,i){var cx=hx+hw*(0.18+i*0.32),cy=hy+hh*0.53,on=l.state===k;
    ctx.save();if(on){ctx.shadowColor=cols[k];ctx.shadowBlur=C*0.35;}
    heartPath(cx,cy,C*(on?0.3:0.26));ctx.fillStyle=on?cols[k]:'rgba(255,255,255,.16)';ctx.fill();ctx.restore();
    if(on){ctx.fillStyle='rgba(255,255,255,.6)';ctx.beginPath();ctx.arc(cx-C*0.05,cy-C*0.05,C*0.03,0,7);ctx.fill();}});
  // kid hint bubble on the crosswalk column
  var bx=x0+(cw+0.5)*C,by=gy+C*0.28,go=l.state==='red',fs=Math.round(C*0.22);
  ctx.font='900 '+fs+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  var txt=go?T('lightGo'):(l.state==='yellow'?T('lightY'):T('lightWait')),tw=ctx.measureText(txt).width+fs;
  ctx.globalAlpha=go?0.95:0.8;ctx.fillStyle=go?'#2fbf71':(l.state==='yellow'?'#f0a500':'#ff5c8a');rr(bx-tw/2,by-fs*0.75,tw,fs*1.5,fs*0.75);ctx.fill();
  ctx.fillStyle='#fff';ctx.fillText(txt,bx,by+1);ctx.globalAlpha=1;
}
// ---------- drawing: road ----------
function rowY(r){return view.oy+(rows.length-1-r)*view.cell;}
function drawWorld(){
  var C=view.cell,W=COLS*C;
  ctx.fillStyle='#bfe8a0';ctx.fillRect(0,0,view.w,view.h);
  ctx.save();
  if(shake>0)ctx.translate(rnd(-1,1)*C*0.15*shake/0.45,rnd(-1,1)*C*0.15*shake/0.45);
  for(var r=0;r<rows.length;r++){var row=rows[r],y=rowY(r),x0=view.ox;
    if(row.type==='road'){
      ctx.fillStyle='#5b5f6b';ctx.fillRect(x0,y,W,C);
      if(rows[r+1]&&rows[r+1].type==='road'){ctx.fillStyle='#f4f4f4';
        for(var d=0;d<COLS;d++)ctx.fillRect(x0+d*C+C*0.2,y-C*0.03,C*0.6,C*0.06);}
      if(!(rows[r+1]&&rows[r+1].type==='road')){ctx.fillStyle='#9aa0ad';ctx.fillRect(x0,y,W,C*0.06);}
      if(!(rows[r-1]&&rows[r-1].type==='road')){ctx.fillStyle='#9aa0ad';ctx.fillRect(x0,y+C*0.94,W,C*0.06);}
      if(row.cw!==undefined){ctx.fillStyle='rgba(255,255,255,.92)';
        for(var zb=0;zb<4;zb++)ctx.fillRect(x0+row.cw*C+C*0.08,y+zb*C*0.25+C*0.05,C*0.84,C*0.14);
        ctx.fillStyle='rgba(255,255,255,.75)';var sl=row.dir>0?row.cw*C-C*0.1:(row.cw+1)*C+C*0.04;ctx.fillRect(x0+sl,y+C*0.06,C*0.06,C*0.88);}
    }else if(row.type==='goal'){
      ctx.fillStyle='#ffd6e7';ctx.fillRect(x0,y,W,C);
      for(var g=0;g<COLS;g++){ctx.fillStyle=g%2?'#ffc2da':'#ffe3ef';ctx.fillRect(x0+g*C,y,C,C);}
      ctx.fillStyle='#ff4f8b';ctx.font='900 '+Math.round(C*0.42)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(T('goalRow'),x0+W/2,y+C/2);
      drawHouse(x0+C*0.5,y+C*0.92,C*0.7,0,'#ff7aa9',1);drawHouse(x0+W-C*0.5,y+C*0.92,C*0.7,0,'#4fc3f7',1);
    }else{
      for(var gx=0;gx<COLS;gx++){ctx.fillStyle=(gx+r)%2?'#8fd46a':'#9fdd78';ctx.fillRect(x0+gx*C,y,C,C);}
      var sd=row.seed||0.3;
      for(var f=0;f<4;f++){var fx=x0+((sd*9973*(f+1))%1)*W,fy=y+(0.2+((sd*7919*(f+3))%1)*0.6)*C;
        ctx.fillStyle=['#fff','#ffe14d','#ff9cc2','#fff'][f];ctx.beginPath();ctx.arc(fx,fy,C*0.06,0,7);ctx.fill();}
      if(row.start){ctx.fillStyle='rgba(255,255,255,.85)';ctx.font='900 '+Math.round(C*0.32)+'px sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(T('startRow'),x0+C*0.15,y+C/2);}
    }
    if(row.coin!==undefined&&row.coin!==false){var cx=x0+(row.coin+0.5)*C,cy=y+C/2+Math.sin(time*4)*C*0.06;
      ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(cx,cy,C*0.22,0,7);ctx.fill();ctx.strokeStyle='#e8a800';ctx.lineWidth=C*0.05;ctx.stroke();
      ctx.fillStyle='#fff6c2';ctx.font='900 '+Math.round(C*0.26)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('★',cx,cy+C*0.01);}
  }
  // cars
  ctx.save();ctx.beginPath();ctx.rect(view.ox,0,W,view.h);ctx.clip();
  for(var r2=0;r2<rows.length;r2++){var rw=rows[r2];if(rw.type!=='road')continue;
    rw.cars.forEach(function(c){drawCar(view.ox+c.x*C,rowY(r2),c.len*C,C,c.color,rw.dir,c.truck);});}
  ctx.restore();
  lights.forEach(drawLight);
  // player
  if(player){var p=curPos(),hop=player.t<1?Math.sin(player.t*Math.PI)*C*0.35:0;
    var px=view.ox+(p.c+0.5)*C,py=view.oy+(rows.length-1-p.r)*C+C*0.55;
    ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.ellipse(px,py+C*0.3,C*0.28*(1-hop/C),C*0.09,0,0,7);ctx.fill();
    if(player.dead){drawHeart(px,py+C*0.1,C*0.9,{dead:true,sx:1.35,sy:0.55});}
    else{var sq=player.t<1?1+Math.sin(player.t*Math.PI)*0.12:1+Math.sin(time*5)*0.03;
      drawHeart(px,py-hop,C*0.82,{sx:1/sq,sy:sq,dir:player.dir});}
  }
  drawFx(function(x,y){return [view.ox+x*C,view.oy+(rows.length-y)*C];},C);
  ctx.restore();
  // side decorations outside board
  if(view.ox>C*0.5){for(var t=0;t<rows.length;t++){if(rows[t].type==='road')continue;
    drawTree(view.ox/2,rowY(t)+C*0.85,C*0.8);drawTree(view.ox+W+view.ox/2,rowY(t)+C*0.85,C*0.8);}}
}

function drawFx(toPx,C){
  particles.forEach(function(p){var q=toPx(p.x,p.y);ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;var s=p.s*C;
    if(p.type==='heart'){heartPath(q[0],q[1],s*2);ctx.fill();}
    else if(p.type==='star'){star(q[0],q[1],s);ctx.fill();}
    else{ctx.fillRect(q[0]-s/2,q[1]-s/2,s,s*0.6);}});
  ctx.globalAlpha=1;
  floaters.forEach(function(f){var q=toPx(f.x,f.y+f.t*0.8);ctx.globalAlpha=1-f.t;ctx.fillStyle='#fff';ctx.strokeStyle='#ff4f8b';ctx.lineWidth=C*0.08;
    ctx.font='900 '+Math.round(C*0.5)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.strokeText(f.txt,q[0],q[1]);ctx.fillText(f.txt,q[0],q[1]);});

}
function star(x,y,s){ctx.beginPath();for(var i=0;i<10;i++){var a=-Math.PI/2+i*Math.PI/5,r=i%2?s*0.45:s;ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}ctx.closePath();}

function drawHeart(x,y,s,o){
  o=o||{};ctx.save();ctx.translate(x,y);ctx.scale(o.sx||1,o.sy||1);
  var g=ctx.createLinearGradient(0,-s*0.45,0,s*0.45);g.addColorStop(0,'#ff8fbd');g.addColorStop(1,'#ff3f7f');

  ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.ellipse(-s*0.27,-s*0.22,s*0.08,s*0.12,-0.5,0,7);ctx.fill();

    var blink=(Math.floor(time*10)%35===0);

      else{ctx.fillStyle='#3a0a20';ctx.beginPath();ctx.ellipse(cx,cy,s*0.055,s*0.07,0,0,7);ctx.fill();
        ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx+s*0.02,cy-s*0.025,s*0.02,0,7);ctx.fill();}});
    ctx.fillStyle='rgba(255,255,255,.45)';
    [-1,1].forEach(function(k){ctx.beginPath();ctx.ellipse(k*s*0.28+ex,s*0.05,s*0.07,s*0.04,0,0,7);ctx.fill();});
    ctx.strokeStyle='#3a0a20';ctx.lineWidth=s*0.04;ctx.lineCap='round';ctx.beginPath();ctx.arc(ex,s*0.04,s*0.08,0.15*Math.PI,0.85*Math.PI);ctx.stroke();

// ---------- houses ----------
function drawHouse(cx,base,s,style,color,pop){
  pop=pop===undefined?1:pop;var k=pop<1?(pop<0.7?pop/0.7*1.15:1.15-(pop-0.7)/0.3*0.15):1;
  ctx.save();ctx.translate(cx,base);ctx.scale(k,k);

  ctx.fillStyle='rgba(0,0,0,.15)';ctx.beginPath();ctx.ellipse(0,0,s*0.45,s*0.08,0,0,7);ctx.fill();
  function door(w,h){ctx.fillStyle='#8a5a3c';rr(-w/2,-h,w,h,w*0.4);ctx.fill();ctx.fillStyle='#ffe14d';ctx.beginPath();ctx.arc(w*0.22,-h*0.45,w*0.08,0,7);ctx.fill();}
  function win(x,y,w){ctx.fillStyle='#fff7c9';rr(x,y,w,w,w*0.2);ctx.fill();ctx.strokeStyle=dk;ctx.lineWidth=w*0.12;ctx.stroke();}
  if(style===0){
    ctx.fillStyle=lt;ctx.fillRect(-s*0.36,-s*0.55,s*0.72,s*0.55);
    ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(-s*0.46,-s*0.52);ctx.lineTo(0,-s*0.92);ctx.lineTo(s*0.46,-s*0.52);ctx.closePath();ctx.fill();
    ctx.fillStyle=dk;ctx.fillRect(s*0.16,-s*0.88,s*0.1,s*0.2);
    door(s*0.2,s*0.3);win(-s*0.3,-s*0.42,s*0.16);win(s*0.14,-s*0.42,s*0.16);
  }else if(style===1){
    ctx.fillStyle=color;ctx.fillRect(-s*0.3,-s*1.1,s*0.6,s*1.1);ctx.fillStyle=dk;ctx.fillRect(-s*0.34,-s*1.16,s*0.68,s*0.08);
    for(var i=0;i<3;i++)for(var j=0;j<2;j++)win(-s*0.21+j*s*0.27,-s*1.0+i*s*0.24,s*0.15);
    door(s*0.2,s*0.26);
  }else if(style===2){
    ctx.fillStyle=lt;ctx.fillRect(-s*0.3,-s*0.6,s*0.6,s*0.6);
    for(var m=0;m<4;m++)ctx.fillRect(-s*0.3+m*s*0.17,-s*0.7,s*0.1,s*0.12);
    [-1,1].forEach(function(q){ctx.fillStyle=lt;ctx.fillRect(q*s*0.38-s*0.1,-s*0.8,s*0.2,s*0.8);
      ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(q*s*0.38-s*0.14,-s*0.8);ctx.lineTo(q*s*0.38,-s*1.08);ctx.lineTo(q*s*0.38+s*0.14,-s*0.8);ctx.closePath();ctx.fill();});
    ctx.strokeStyle='#888';ctx.lineWidth=s*0.02;ctx.beginPath();ctx.moveTo(s*0.38,-s*1.08);ctx.lineTo(s*0.38,-s*1.25);ctx.stroke();
    ctx.fillStyle='#ff4f8b';ctx.beginPath();ctx.moveTo(s*0.38,-s*1.25);ctx.lineTo(s*0.52,-s*1.2);ctx.lineTo(s*0.38,-s*1.15);ctx.fill();
    door(s*0.22,s*0.34);win(-s*0.08,-s*0.52,s*0.16);
  }else{
    heartPath(0,-s*0.48,s*1.0);ctx.fillStyle=color;ctx.fill();ctx.strokeStyle=dk;ctx.lineWidth=s*0.04;ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.5)';ctx.beginPath();ctx.ellipse(-s*0.26,-s*0.7,s*0.07,s*0.1,-0.5,0,7);ctx.fill();
    door(s*0.2,s*0.3);win(-s*0.08,-s*0.66,s*0.16);
  }
  ctx.restore();
}

var town={x:0,y:0,cw:0,ch:0};
var townAnim=save.houses;
save.houses.forEach(function(h){h.pop=1;});
function setFreeMode(f){
  f=!!f;var old=save;FREE=f;save=f?saveF:saveC;save.muted=old.muted;
  TOWN_C=f?10:8;TOWN_R=f?6:5;townAnim=save.houses;save.houses.forEach(function(h){if(!(h.pop<1))h.pop=1;});
  document.body.classList.toggle('free',f);curHouse=null;townRemove=false;
  if(typeof makeOptions==='function')makeOptions();updateHud();
}
function goTitle(){unlockAudio();mode='title';hideAll();document.body.classList.remove('building','inroom');if(FREE)setFreeMode(false);buildLevel();updateHud();$('titleScreen').classList.remove('hidden');}
function layoutTown(){
  var barH=$('buildBar').offsetHeight||0, availH=view.h-barH-10, top=view.h*0.0;
  var cw=Math.min((view.w-20)/TOWN_C,(availH*0.82)/TOWN_R);
  town.cw=cw;town.ch=cw;town.x=(view.w-cw*TOWN_C)/2;town.y=Math.max(availH*0.16,availH-cw*TOWN_R)+top;
}
function drawTown(){
  layoutTown();

  ctx.fillStyle=g;ctx.fillRect(0,0,view.w,town.y);
  ctx.fillStyle='#fff';[[0.15,0.3],[0.55,0.15],[0.85,0.4]].forEach(function(p,i){var x=((p[0]*view.w+time*12*(i+1))%(view.w+120))-60,y=p[1]*town.y;
    ctx.beginPath();ctx.arc(x,y,18,0,7);ctx.arc(x+20,y-8,22,0,7);ctx.arc(x+42,y,16,0,7);ctx.fill();});
  ctx.fillStyle='#ffe14d';ctx.beginPath();ctx.arc(view.w-50,Math.max(36,town.y*0.3),24,0,7);ctx.fill();
  ctx.fillStyle='#9fdd78';ctx.fillRect(0,town.y,view.w,view.h-town.y);
  ctx.fillStyle='#ff4f8b';ctx.font='900 '+Math.round(Math.min(40,Math.max(20,view.w*0.04)))+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(T('townTitle'),view.w/2,Math.max(26,town.y*0.45));
  drawTownPlots();
  // heart walking around
  var hx=town.x-town.cw*0.0+((time*30)%(town.cw*TOWN_C)),hy=town.y+town.ch*0.05-Math.abs(Math.sin(time*6))*8;
  drawHeart(hx,hy,town.cw*0.55,{dir:1});

function dataURLFile(u,name){var b=atob(u.split(',')[1]),n=b.length,a=new Uint8Array(n);for(var i=0;i<n;i++)a[i]=b.charCodeAt(i);
  try{return new File([a],name,{type:'image/png'});}catch(e){var bl=new Blob([a],{type:'image/png'});bl.name=name;return bl;}}
function prepShare(levelN){

  var n=save.houses.length,text=levelN?T('shareTextLevel',{n:levelN}):FREE?T(n===1?'shareTextFree1':'shareTextFree',{n:n}):T(n===1?'shareText1':'shareText',{n:n,l:save.level});
  lastShare={url:u,text:text,file:dataURLFile(u,levelN?'heart-crossing-level-'+levelN+'.png':'my-heart-town.png')};return lastShare;
}
// must run synchronously inside the tap handler (iOS needs the user gesture)
function shareNow(sh){
  try{
    if(navigator.share&&navigator.canShare&&navigator.canShare({files:[sh.file]})){
      navigator.share({files:[sh.file],title:T('docTitleShort'),text:sh.text+' '+shareURL()}).catch(function(e){if(!e||e.name!=='AbortError')showShareModal(sh);});return 'files';}
    if(navigator.share){navigator.share({title:T('docTitleShort'),text:sh.text,url:shareURL()}).catch(function(e){if(!e||e.name!=='AbortError')showShareModal(sh);});return 'text';}
  }catch(e){}
  showShareModal(sh);return 'modal';
}
function doShare(levelN){unlockAudio();sfx.click();return shareNow(prepShare(levelN));}
function showShareModal(sh){
  $('shareImg').src=sh.url;var a=$('saveImgBtn');a.href=sh.url;a.setAttribute('download',sh.file.name||'my-heart-town.png');
  $('shareAgainBtn').classList.toggle('hidden',!navigator.share);$('copyLinkBtn').textContent=T('copyLink');
  $('shareModal').classList.remove('hidden');
}
function copyLink(){
  var done=function(){$('copyLinkBtn').textContent=T('copied');tone(880,0.1,'triangle',0.08);setTimeout(function(){$('copyLinkBtn').textContent=T('copyLink');},2000);};
  var fallback=function(){var t=document.createElement('textarea');t.value=shareURL();t.setAttribute('readonly','');t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);
    t.select();t.setSelectionRange(0,99999);var ok=false;try{ok=document.execCommand('copy');}catch(e){}document.body.removeChild(t);if(ok)done();else window.prompt(T('copyPrompt'),shareURL());};
  try{if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(shareURL()).then(done,fallback);return;}}catch(e){}
  fallback();
}
$('shareBtn').addEventListener('click',function(){doShare(0);});
$('winShareBtn').addEventListener('click',function(){doShare(winLevel);});
$('shareAgainBtn').addEventListener('click',function(){unlockAudio();if(lastShare)shareNow(lastShare);});
$('copyLinkBtn').addEventListener('click',function(){unlockAudio();copyLink();});
$('closeShareBtn').addEventListener('click',function(){sfx.click();$('shareModal').classList.add('hidden');});
